[www]

user = laravel
group = laravel

listen = 9000

listen.owner = laravel
listen.group = laravel

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

catch_workers_output = yes

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2