services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_react_boilerplate-app
    working_dir: /var/www
    user: "1000:1000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
    - app-network

  nginx:
    image: nginx:alpine
    container_name: laravel_react_boilerplate-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped
    networks:
    - app-network

  node:
    image: node:22-alpine
    container_name: laravel_react_boilerplate-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    tty: true
    restart: unless-stopped
    networks:
    - app-network

  mysql:
    image: mysql:8.4
    container_name: laravel_react_boilerplate-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
    - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_react_boilerplate-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:8-alpine
    container_name: laravel_react_boilerplate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
    - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: laravel_react_boilerplate-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    networks:
    - app-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_react_boilerplate-queue
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=90
    user: "1000:1000"
    volumes:
      - .:/var/www
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    networks:
    - app-network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_react_boilerplate-scheduler
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    user: "1000:1000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
    - app-network

  ssr:
    image: node:22-alpine
    container_name: laravel_react_boilerplate-ssr
    working_dir: /var/www
    command: sh -c "npm install && npm run ssr"
    volumes:
      - .:/var/www
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  mailpit_data:

networks:
  app-network:
    driver: bridge