services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_react_boilerplate-app
    working_dir: /var/www
    volumes:
      - .:/var/www
  nginx:
    image: nginx:alpine
    container_name: laravel_react_boilerplate-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  node:
    image: node:22-alpine
    container_name: laravel_react_boilerplate-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    tty: true